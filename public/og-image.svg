<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source for og-image.png. "Quiet" palette — see docs/DESIGN-SYSTEM.md -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&amp;family=Instrument+Sans:wght@400..700&amp;display=swap');
    .display { font-family: 'Newsreader', 'Iowan Old Style', Georgia, serif; }
    .body { font-family: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif; }
  </style>

  <rect width="1200" height="630" fill="#FFFFFF"/>

  <!-- Mark -->
  <g transform="translate(560 92) scale(0.4)">
    <path d="M100 20 C60 20, 30 50, 30 90 C30 130, 100 185, 100 185 C100 185, 170 130, 170 90 C170 50, 140 20, 100 20 Z" fill="#C8361B"/>
    <circle cx="100" cy="90" r="46" fill="#FFFFFF"/>
    <circle cx="84" cy="80" r="7" fill="#141414"/>
    <circle cx="116" cy="80" r="7" fill="#141414"/>
    <path d="M78 100 Q 100 124, 122 100" stroke="#141414" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text class="display" x="600" y="352" text-anchor="middle" font-size="112" font-weight="500" letter-spacing="-2.5" fill="#141414">What’s <tspan font-style="italic" font-weight="400">Good</tspan> Here</text>

  <line x1="560" y1="408" x2="640" y2="408" stroke="#D6D3CC" stroke-width="2"/>

  <!-- Tagline -->
  <text class="body" x="600" y="470" text-anchor="middle" font-size="30" font-weight="500" fill="#5C5C5C">The best dishes, ranked by locals</text>
  <text class="body" x="600" y="534" text-anchor="middle" font-size="18" font-weight="600" letter-spacing="3.5" fill="#707070">MARTHA’S VINEYARD &amp; BEYOND</text>
</svg>
