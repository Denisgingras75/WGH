<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source for og-image.png. "Lobster Buoy" palette — see docs/DESIGN-SYSTEM.md -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&amp;family=Instrument+Sans:wght@400..700&amp;display=swap');
    .display { font-family: 'Bricolage Grotesque', 'Arial Black', sans-serif; font-weight: 800; font-stretch: 80%; }
    .body { font-family: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif; }
  </style>

  <!-- Cream paper -->
  <rect width="1200" height="630" fill="#F6EEDC"/>

  <!-- Food sticker scatter (Dan's icon set) -->
  <image href="categories/icons/lobster-roll.webp" x="10" y="-10" width="300" height="300" transform="rotate(-10 160 140)"/>
  <image href="categories/icons/pizza.webp" x="900" y="-14" width="280" height="280" transform="rotate(12 1040 126)"/>
  <image href="categories/icons/chowder.webp" x="20" y="350" width="270" height="270" transform="rotate(8 155 485)"/>
  <image href="categories/icons/ice-cream.webp" x="920" y="345" width="260" height="280" transform="rotate(-8 1050 485)"/>

  <!-- Wordmark: What's [Good] Here -->
  <text class="display" x="600" y="228" text-anchor="middle" font-size="104" letter-spacing="-3" fill="#1B1611">What’s</text>
  <g transform="rotate(-3 600 312)">
    <rect x="452" y="248" width="296" height="128" rx="24" fill="#1B1611" transform="translate(9 9)"/>
    <rect x="452" y="248" width="296" height="128" rx="24" fill="#FFC83D" stroke="#1B1611" stroke-width="7"/>
    <text class="display" x="600" y="348" text-anchor="middle" font-size="104" letter-spacing="-3" fill="#1B1611">Good</text>
  </g>
  <text class="display" x="600" y="470" text-anchor="middle" font-size="104" letter-spacing="-3" fill="#1B1611">Here</text>

  <!-- Tagline + region pill -->
  <text class="body" x="600" y="528" text-anchor="middle" font-size="30" font-weight="700" fill="#554A3E">The best dishes, ranked by locals</text>
  <rect x="440" y="553" width="320" height="48" rx="24" fill="#CA3216" stroke="#1B1611" stroke-width="3.5"/>
  <text class="body" x="600" y="585" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="0.5" fill="#FFFFFF">Martha’s Vineyard &amp; Beyond</text>
</svg>
